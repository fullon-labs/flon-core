# BP runtime preset for the core node build.
# Keep HTTP private; expose public RPC through a separate RPC node.
plugin = eosio::chain_api_plugin
plugin = eosio::producer_api_plugin
plugin = eosio::prometheus_plugin

http-server-address = 127.0.0.1:8888

# Operator-specific values must be supplied by deployment secrets/config:
# producer-name = yourbpaccount
# signature-provider = PUBLIC_KEY=KEY:PRIVATE_KEY

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_TYPE: Release
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64
            runner: ubuntu-22.04
            artifact: ubuntu-22.04-x86_64
            llvm_prefix: /usr/lib/llvm-11
          - name: macOS
            runner: macos-15
            artifact: macos
            llvm_prefix: /opt/homebrew
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0

      - name: Check out configured submodules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git config --file .gitmodules --get-regexp path | wc -l | tr -d ' ')" -gt 0
          git submodule sync --recursive
          git config --file .gitmodules --get-regexp path | awk '{print $2}' | while IFS= read -r submodule; do
            git submodule update --init --recursive -- "$submodule"
          done

      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

          major=$(sed -nE 's/^set\(VERSION_MAJOR ([0-9]+)\)$/\1/p' CMakeLists.txt)
          minor=$(sed -nE 's/^set\(VERSION_MINOR ([0-9]+)\)$/\1/p' CMakeLists.txt)
          patch=$(sed -nE 's/^set\(VERSION_PATCH ([0-9]+)\)$/\1/p' CMakeLists.txt)
          version="${major}.${minor}.${patch}"
          test "v${version}" = "$RELEASE_TAG"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            file \
            git \
            libcurl4-openssl-dev \
            libgmp-dev \
            librocksdb-dev \
            llvm-11-dev \
            ninja-build \
            python3-numpy \
            zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja rocksdb
          # CMake 4.5 rejects the bundled Boost.Locale source_group layout.
          python3 -m venv "$RUNNER_TEMP/flon-release-tools"
          "$RUNNER_TEMP/flon-release-tools/bin/python" -m pip install 'cmake==4.1.2'
          "$RUNNER_TEMP/flon-release-tools/bin/cmake" --version
          echo "$RUNNER_TEMP/flon-release-tools/bin" >> "$GITHUB_PATH"

      - name: Configure core build
        shell: bash
        run: |
          set -euo pipefail
          llvm_prefix="${{ matrix.llvm_prefix }}"
          cmake -S . -B build-release-core -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$llvm_prefix" \
            -DBUILD_TESTS=OFF \
            -DFLON_NODE_VARIANT=core \
            -DFLON_BUILD_CLIENT_TOOLS=ON

      - name: Build core node and tools archives
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-release-core \
            --target flon-node-package flon-tools-package \
            --parallel 4

      - name: Build Ubuntu DEB packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-release-core --target package --parallel 4

      - name: Configure history build
        shell: bash
        run: |
          set -euo pipefail
          llvm_prefix="${{ matrix.llvm_prefix }}"
          cmake -S . -B build-release-history -G Ninja \
            -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$llvm_prefix" \
            -DBUILD_TESTS=OFF \
            -DFLON_NODE_VARIANT=history \
            -DFLON_BUILD_CLIENT_TOOLS=OFF

      - name: Build history node archive
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-release-history \
            --target flon-node-package \
            --parallel 4

      - name: Stage and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build-release-core/packages/*.tar.gz release-assets/
          cp build-release-core/packages/*.zip release-assets/
          cp build-release-history/packages/*.tar.gz release-assets/
          cp build-release-history/packages/*.zip release-assets/
          if [[ "$RUNNER_OS" == Linux ]]; then
            cp build-release-core/*.deb release-assets/
          fi

          test "$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 3
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" -eq 3
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" -ge 3
          fi

          checksum_file="SHA256SUMS-${{ matrix.artifact }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release-assets && sha256sum ./*) > "$RUNNER_TEMP/$checksum_file"
          else
            (cd release-assets && shasum -a 256 ./*) > "$RUNNER_TEMP/$checksum_file"
          fi
          mv "$RUNNER_TEMP/$checksum_file" "release-assets/$checksum_file"
          git rev-parse HEAD > "release-assets/build-commit-${{ matrix.artifact }}.txt"
          ls -lh release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out release workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          build_commit=$(cat release-assets/build-commit-ubuntu-22.04-x86_64.txt)
          [[ "$build_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$build_commit" = "$(cat release-assets/build-commit-macos.txt)"
          for artifact in ubuntu-22.04-x86_64 macos; do
            unlink "release-assets/build-commit-$artifact.txt"
          done
          echo "BUILD_COMMIT=$build_commit" >> "$GITHUB_ENV"
          test "$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" -ge 3
          test "$(find release-assets -maxdepth 1 -type f -name 'SHA256SUMS-*.txt' | wc -l | tr -d ' ')" -eq 2
          ls -lh release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          tag_refs=$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}")
          tag_commit=$(awk -v tag="$tag_ref" '
            $2 == tag { direct = $1 }
            $2 == tag "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ' <<< "$tag_refs")
          if [[ "$tag_commit" != "$BUILD_COMMIT" ]]; then
            echo "::error::Release tag no longer points to the built commit $BUILD_COMMIT"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "FLON Core ${RELEASE_TAG}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          asset_names=$(printf '%s\n' release-assets/* | sed 's#^release-assets/##' | jq -Rn '[inputs]')
          assets_updated_at=$(gh release view "$RELEASE_TAG" --json assets |
            jq -er --argjson names "$asset_names" '
              [.assets[] | select(.name as $name | $names | index($name))]
              | select(length == ($names | length))
              | map(.updatedAt) | max')
          actions_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh release view "$RELEASE_TAG" --json body --jq '.body' |
            python3 .github/scripts/update-release-notes.py "$BUILD_COMMIT" "$assets_updated_at" "$actions_url" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --notes-file "$RUNNER_TEMP/release-notes.md"
